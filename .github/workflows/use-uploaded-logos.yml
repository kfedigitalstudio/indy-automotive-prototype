name: Use uploaded logos

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Use uploaded PNG logos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace generated SVG logos with uploaded PNG logos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              Path('dealer/index.html'),
              Path('repairs/index.html'),
              Path('repairs/brakes/index.html'),
              Path('rental/index.html'),
          ]

          for p in pages:
              s = p.read_text(encoding='utf-8')
              s = s.replace('indy-auto-group-logo.svg', 'indy-auto-group-logo.png')
              s = s.replace('indy-auto-repairs-logo.svg', 'indy-auto-repairs-logo.png')
              s = s.replace('alta-rental-logo.svg', 'alta-rental-logo.png')

              # Make the uploaded logo artwork sit naturally in the navigation bar.
              s = s.replace(
                  '.brand-logo{display:flex;align-items:center;min-width:240px}.brand-logo img{display:block;height:58px;width:auto;max-width:290px}',
                  '.brand-logo{display:flex;align-items:center;min-width:220px;height:64px;overflow:hidden}.brand-logo img{display:block;width:230px;height:64px;object-fit:contain;object-position:left center}'
              )
              s = s.replace(
                  '.brand-logo{min-width:0}.brand-logo img{height:48px;max-width:235px}',
                  '.brand-logo{min-width:0;height:52px}.brand-logo img{width:190px;height:52px;object-fit:contain;object-position:left center}'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit uploaded-logo integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add dealer/index.html repairs/index.html repairs/brakes/index.html rental/index.html
          git commit -m "Use manually uploaded logo files [skip ci]"
          git push
