name: Enlarge logo display

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Enlarge uploaded logo display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge visible logo artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              Path('dealer/index.html'),
              Path('repairs/index.html'),
              Path('repairs/brakes/index.html'),
              Path('rental/index.html'),
          ]

          old_desktop = '.brand-logo{display:flex;align-items:center;min-width:220px;height:64px;overflow:hidden}.brand-logo img{display:block;width:230px;height:64px;object-fit:contain;object-position:left center}'
          new_desktop = '.brand-logo{display:flex;align-items:center;justify-content:flex-start;min-width:300px;width:300px;height:90px;overflow:hidden}.brand-logo img{display:block;width:300px;height:90px;object-fit:contain;object-position:center;transform:scale(1.8);transform-origin:center}'
          old_mobile = '.brand-logo{min-width:0;height:52px}.brand-logo img{width:190px;height:52px;object-fit:contain;object-position:left center}'
          new_mobile = '.brand-logo{min-width:0;width:220px;height:64px}.brand-logo img{width:220px;height:64px;object-fit:contain;object-position:center;transform:scale(1.75);transform-origin:center}'

          for p in pages:
              s = p.read_text(encoding='utf-8')
              if old_desktop not in s:
                  raise RuntimeError(f'Desktop logo CSS not found in {p}')
              s = s.replace(old_desktop, new_desktop, 1)
              if old_mobile not in s:
                  raise RuntimeError(f'Mobile logo CSS not found in {p}')
              s = s.replace(old_mobile, new_mobile, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit logo sizing update
        shell: bash
        run: |
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add dealer/index.html repairs/index.html repairs/brakes/index.html rental/index.html
          git commit -m "Enlarge uploaded logo artwork [skip ci]"
          git push
