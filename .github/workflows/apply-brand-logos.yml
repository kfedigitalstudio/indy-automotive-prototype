name: Apply site brand logos

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply site brand logos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject logo assets into site headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              ("dealer/index.html", "./", "../assets/indy-auto-group-logo.svg", "Indy Auto Group"),
              ("repairs/index.html", "./", "../assets/indy-auto-repairs-logo.svg", "Indy Auto Repairs"),
              ("repairs/brakes/index.html", "../", "../../assets/indy-auto-repairs-logo.svg", "Indy Auto Repairs"),
              ("rental/index.html", "./", "../assets/alta-rental-logo.svg", "Alta Rental"),
          ]

          logo_css = ".brand-logo{display:flex;align-items:center;min-width:240px}.brand-logo img{display:block;height:58px;width:auto;max-width:290px}"
          mobile_css = ".brand-logo{min-width:0}.brand-logo img{height:48px;max-width:235px}"

          for file_path, href, logo_src, alt in pages:
              p = Path(file_path)
              s = p.read_text(encoding="utf-8")

              if ".brand-logo img" not in s:
                  s = s.replace(".links{", logo_css + ".links{", 1)
                  if "@media(max-width:680px){" in s:
                      s = s.replace("@media(max-width:680px){", "@media(max-width:680px){" + mobile_css, 1)
                  elif "@media(max-width:650px){" in s:
                      s = s.replace("@media(max-width:650px){", "@media(max-width:650px){" + mobile_css, 1)

              replacement = (
                  f'<a class="brand brand-logo" href="{href}" aria-label="{alt} home">'
                  f'<img src="{logo_src}" alt="{alt}"></a>'
              )
              pattern = rf'<a class="brand" href="{re.escape(href)}">.*?</a>'
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count == 0 and "brand-logo" not in s:
                  raise RuntimeError(f"Could not locate brand anchor in {file_path}")

              p.write_text(s, encoding="utf-8")

          PY

      - name: Commit logo integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add dealer/index.html repairs/index.html repairs/brakes/index.html rental/index.html
          git commit -m "Integrate automotive brand logos [skip ci]"
          git push
