name: Combine repair slideshow and steps

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Combine repair slideshow and service steps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update repair process section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('repairs/index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".inside{background:#f3f3f1}.insidegrid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}.gallery{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.mainimg,.side1,.side2{border-radius:20px;background-size:cover;background-position:center;box-shadow:0 14px 34px rgba(31,37,43,.14)}.mainimg{min-height:460px;background-image:url('https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=1300&q=85')}.side1{min-height:223px;background-image:url('https://images.unsplash.com/photo-1625047509248-ec889cbff17f?auto=format&fit=crop&w=900&q=85')}.side2{min-height:223px;margin-top:14px;background-image:url('https://images.unsplash.com/photo-1632823471565-1ecdfec9fb65?auto=format&fit=crop&w=900&q=85')}.inside h2{font-size:42px;letter-spacing:-.035em;margin:0 0 12px}.inside p{color:var(--m);line-height:1.75}.bullets{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.bullets div{background:#fff;border:1px solid var(--l);border-radius:10px;padding:11px;font-size:13px;font-weight:750}"
          new_css = ".inside{background:#f3f3f1}.process-showcase{display:grid;grid-template-columns:1.18fr .82fr;gap:22px;align-items:stretch}.process-slider{position:relative;min-height:520px;border-radius:22px;overflow:hidden;background:#171c21;box-shadow:0 18px 42px rgba(31,37,43,.18)}.process-slide{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;background-size:cover;background-position:center}.process-slide.active{opacity:1}.process-slide:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,20,24,.08),rgba(16,20,24,.82))}.ps1{background-image:url('https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=1400&q=88')}.ps2{background-image:url('https://images.unsplash.com/photo-1625047509248-ec889cbff17f?auto=format&fit=crop&w=1400&q=88')}.ps3{background-image:url('https://images.unsplash.com/photo-1632823471565-1ecdfec9fb65?auto=format&fit=crop&w=1400&q=88')}.ps4{background-image:url('https://images.unsplash.com/photo-1487754180451-c456f719a1fc?auto=format&fit=crop&w=1400&q=88')}.process-caption{position:absolute;left:28px;right:28px;bottom:28px;z-index:2;color:#fff}.process-caption small{display:inline-block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:#ffd3aa;margin-bottom:7px}.process-caption h3{font-size:32px;margin:0 0 7px}.process-caption p{max-width:650px;margin:0;color:#e5e8eb;line-height:1.55}.process-arrows{position:absolute;right:16px;top:16px;z-index:3;display:flex;gap:7px}.process-arrows button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.38);background:rgba(0,0,0,.34);color:#fff;font-size:18px;cursor:pointer}.process-dots{position:absolute;left:28px;top:22px;z-index:3;display:flex;gap:7px}.process-dots button{width:10px;height:10px;border:0;border-radius:50%;background:rgba(255,255,255,.42);cursor:pointer}.process-dots button.on{background:#fff}.step-panel{background:#fff;border:1px solid var(--l);border-radius:22px;padding:28px;box-shadow:0 14px 34px rgba(31,37,43,.10);display:flex;flex-direction:column;justify-content:center}.step-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#a34d00}.step-panel h2{font-size:40px;letter-spacing:-.035em;margin:8px 0 12px}.step-panel p{color:var(--m);line-height:1.7;margin:0 0 18px}.step-list{display:grid;gap:9px;margin:8px 0 20px}.step-tab{display:grid;grid-template-columns:40px 1fr;gap:11px;align-items:center;border:1px solid var(--l);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left}.step-tab.active{border-color:var(--o);background:#fff8f0;box-shadow:0 7px 18px rgba(242,140,40,.12)}.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#252b31;color:#fff;font-weight:900}.step-tab.active .step-num{background:var(--o);color:#25170a}.step-tab b{display:block;margin-bottom:2px}.step-tab span{font-size:12px;color:var(--m)}"
          if old_css not in s:
              raise RuntimeError('Old inside-shop CSS not found')
          s = s.replace(old_css, new_css, 1)

          s = s.replace("@media(max-width:900px){.herogrid,.insidegrid,.locgrid{grid-template-columns:1fr}.crossgrid{grid-template-columns:1fr}.services,.specials,.reviews{grid-template-columns:1fr 1fr}.quickgrid{grid-template-columns:1fr 1fr}.foot .w{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr}}", "@media(max-width:900px){.herogrid,.process-showcase,.locgrid{grid-template-columns:1fr}.crossgrid{grid-template-columns:1fr}.services,.specials,.reviews{grid-template-columns:1fr 1fr}.quickgrid{grid-template-columns:1fr 1fr}.foot .w{grid-template-columns:1fr 1fr}.process-slider{min-height:470px}}", 1)
          s = s.replace("@media(max-width:650px){.brand-logo{min-width:0;width:auto;height:70px}.brand-logo img{width:auto;height:auto;max-width:185px;max-height:64px;object-fit:contain;object-position:left center;transform:none}.links{display:none}.services,.specials,.reviews,.quickgrid,.foot .w{grid-template-columns:1fr}.fields,.bullets{grid-template-columns:1fr}.full{grid-column:auto}.head{display:block}.head p{margin-top:10px}.promo{grid-template-columns:1fr}}", "@media(max-width:650px){.brand-logo{min-width:0;width:auto;height:70px}.brand-logo img{width:auto;height:auto;max-width:185px;max-height:64px;object-fit:contain;object-position:left center;transform:none}.links{display:none}.services,.specials,.reviews,.quickgrid,.foot .w{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.head{display:block}.head p{margin-top:10px}.promo{grid-template-columns:1fr}.process-slider{min-height:430px}.process-caption{left:20px;right:20px;bottom:22px}.process-caption h3{font-size:27px}.step-panel{padding:20px}.step-panel h2{font-size:34px}}", 1)

          old_html = "<section class=\"sec inside\" id=\"inside\"><div class=\"w insidegrid\"><div class=\"gallery\"><div class=\"mainimg\"></div><div><div class=\"side1\"></div><div class=\"side2\"></div></div></div><div><div class=\"ey\" style=\"color:#a34d00\">Inside the shop</div><h2>See the service work more clearly.</h2><p>This section uses larger, more detailed shop photography so visitors can immediately see technicians, tools, under-hood work and hands-on service instead of relying on a small generic automotive image.</p><div class=\"bullets\"><div>Technicians actively performing service</div><div>More visible under-hood work</div><div>Detailed repair environment</div><div>Stronger trust and credibility</div></div><div class=\"actions\"><a class=\"btn dark\" href=\"brakes/\">View Brake Service</a><a class=\"btn orange\" href=\"#booking\">Schedule Service</a></div></div></div></section>"
          new_html = "<section class=\"sec inside\" id=\"inside\"><div class=\"w\"><div class=\"head\"><h2>See how the service process works</h2><p>The slideshow and service steps move together so customers can see what is happening at each stage of the repair process.</p></div><div class=\"process-showcase\"><div class=\"process-slider\" id=\"processSlider\"><div class=\"process-slide ps1 active\"><div class=\"process-caption\"><small>Step 1 • Inspect</small><h3>Initial vehicle inspection</h3><p>A technician reviews the vehicle, checks the reported concern and looks for visible wear or related issues.</p></div></div><div class=\"process-slide ps2\"><div class=\"process-caption\"><small>Step 2 • Diagnose</small><h3>Pinpoint the cause</h3><p>Testing and hands-on diagnosis help identify what is actually causing the symptom before repairs are recommended.</p></div></div><div class=\"process-slide ps3\"><div class=\"process-caption\"><small>Step 3 • Repair</small><h3>Perform the approved work</h3><p>Once the customer approves the repair, the technician completes the service using the appropriate tools and replacement parts.</p></div></div><div class=\"process-slide ps4\"><div class=\"process-caption\"><small>Step 4 • Final Check</small><h3>Verify the repair</h3><p>The repaired system is checked again so the shop can confirm the work addressed the concern before the vehicle is returned.</p></div></div><div class=\"process-arrows\"><button id=\"processPrev\" aria-label=\"Previous service step\">←</button><button id=\"processNext\" aria-label=\"Next service step\">→</button></div><div class=\"process-dots\"><button class=\"on\" data-step=\"0\" aria-label=\"Show inspection step\"></button><button data-step=\"1\" aria-label=\"Show diagnosis step\"></button><button data-step=\"2\" aria-label=\"Show repair step\"></button><button data-step=\"3\" aria-label=\"Show final check step\"></button></div></div><div class=\"step-panel\"><div class=\"step-kicker\">Inside the shop</div><h2>Four clear stages of service.</h2><p>Choose a step or let the slideshow rotate automatically. The image and explanation stay synchronized.</p><div class=\"step-list\"><button class=\"step-tab active\" data-step=\"0\"><span class=\"step-num\">1</span><span><b>Inspect</b><span>Review the concern and visible condition.</span></span></button><button class=\"step-tab\" data-step=\"1\"><span class=\"step-num\">2</span><span><b>Diagnose</b><span>Test and identify the root cause.</span></span></button><button class=\"step-tab\" data-step=\"2\"><span class=\"step-num\">3</span><span><b>Repair</b><span>Complete the approved service work.</span></span></button><button class=\"step-tab\" data-step=\"3\"><span class=\"step-num\">4</span><span><b>Final Check</b><span>Verify the system and completed repair.</span></span></button></div><div class=\"actions\"><a class=\"btn dark\" href=\"brakes/\">View Brake Service</a><a class=\"btn orange\" href=\"#booking\">Schedule Service</a></div></div></div></div></section>"
          if old_html not in s:
              raise RuntimeError('Old inside-shop HTML not found')
          s = s.replace(old_html, new_html, 1)

          js = "<script>(function(){const slides=[...document.querySelectorAll('.process-slide')],dots=[...document.querySelectorAll('.process-dots button')],tabs=[...document.querySelectorAll('.step-tab')];let i=0,t;function show(n){i=(n+slides.length)%slides.length;slides.forEach((el,j)=>el.classList.toggle('active',j===i));dots.forEach((el,j)=>el.classList.toggle('on',j===i));tabs.forEach((el,j)=>el.classList.toggle('active',j===i));}function restart(){clearInterval(t);t=setInterval(()=>show(i+1),5000)}document.getElementById('processPrev').addEventListener('click',()=>{show(i-1);restart()});document.getElementById('processNext').addEventListener('click',()=>{show(i+1);restart()});[...dots,...tabs].forEach(el=>el.addEventListener('click',()=>{show(Number(el.dataset.step));restart()}));show(0);restart();})();</script>"
          if '</body>' not in s:
              raise RuntimeError('Closing body not found')
          s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair slideshow update
        shell: bash
        run: |
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add repairs/index.html
          git commit -m "Combine repair slideshow with service steps [skip ci]"
          git push
