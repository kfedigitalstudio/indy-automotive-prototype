name: Wire mobile experience

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Wire shared mobile experience into all sites'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared mobile assets to all pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
              Path('dealer/index.html'): '../assets/',
              Path('repairs/index.html'): '../assets/',
              Path('rental/index.html'): '../assets/',
              Path('repairs/brakes/index.html'): '../../assets/',
          }

          for path, prefix in pages.items():
              s = path.read_text(encoding='utf-8')
              s = s.replace('content="width=device-width,initial-scale=1"', 'content="width=device-width,initial-scale=1,viewport-fit=cover"', 1)
              css = f'<link rel="stylesheet" href="{prefix}mobile.css">'
              js = f'<script src="{prefix}mobile.js"></script>'
              if css not in s:
                  if '</head>' not in s:
                      raise RuntimeError(f'No </head> in {path}')
                  s = s.replace('</head>', css + '</head>', 1)
              if js not in s:
                  if '</body>' not in s:
                      raise RuntimeError(f'No </body> in {path}')
                  s = s.replace('</body>', js + '</body>', 1)
              path.write_text(s, encoding='utf-8')
              print('updated', path)
          PY

      - name: Commit mobile integration
        shell: bash
        run: |
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add dealer/index.html repairs/index.html rental/index.html repairs/brakes/index.html
          git commit -m "Make automotive sites fully mobile navigable [skip ci]"
          git push
