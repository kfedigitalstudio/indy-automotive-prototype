name: Prepare web logos

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Correct web logo crops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Rebuild tightly cropped web logo assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          logos = {
              'assets/indy-auto-group-logo.png': 'assets/indy-auto-group-logo-web.png',
              'assets/indy-auto-repairs-logo.png': 'assets/indy-auto-repairs-logo-web.png',
              'assets/alta-rental-logo.png': 'assets/alta-rental-logo-web.png',
          }

          for src_name, out_name in logos.items():
              src = Path(src_name)
              out = Path(out_name)
              original = Image.open(src).convert('RGBA')
              rgb = original.convert('RGB')

              white = Image.new('RGB', rgb.size, (255, 255, 255))
              diff = ImageChops.difference(rgb, white)
              dr, dg, db = diff.split()
              color_mask = ImageChops.lighter(ImageChops.lighter(dr, dg), db)
              color_mask = color_mask.point(lambda p: 255 if p > 14 else 0)

              alpha = original.getchannel('A')
              alpha_min, alpha_max = alpha.getextrema()
              if alpha_min < 250:
                  alpha_mask = alpha.point(lambda p: 255 if p > 20 else 0)
                  mask = ImageChops.lighter(color_mask, alpha_mask)
              else:
                  # Fully opaque PNG: ignore alpha or it would mark the white canvas as artwork.
                  mask = color_mask

              bbox = mask.getbbox()
              if not bbox:
                  raise RuntimeError(f'Could not detect logo artwork in {src_name}')

              l, t, r, b = bbox
              art_w, art_h = r - l, b - t
              pad_x = max(14, round(art_w * 0.045))
              pad_y = max(12, round(art_h * 0.06))
              crop_box = (
                  max(0, l - pad_x),
                  max(0, t - pad_y),
                  min(original.width, r + pad_x),
                  min(original.height, b + pad_y),
              )
              img = original.crop(crop_box)

              max_w = 900
              if img.width > max_w:
                  ratio = max_w / img.width
                  img = img.resize((max_w, max(1, round(img.height * ratio))), Image.Resampling.LANCZOS)

              img.save(out, 'PNG', optimize=True)
              print(f'{src_name}: original={original.size}, artwork_bbox={bbox}, crop={crop_box}, web={img.size}')

          # Safety check: all pages must already point at the web copies and use no transforms.
          for page in ['dealer/index.html','repairs/index.html','repairs/brakes/index.html','rental/index.html']:
              text = Path(page).read_text(encoding='utf-8')
              if '-logo-web.png' not in text:
                  raise RuntimeError(f'{page} is not using the web logo asset')
              if 'transform:scale(' in text:
                  raise RuntimeError(f'{page} still contains logo scaling transform')
          PY

      - name: Commit corrected web crops
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No logo crop changes needed"
            exit 0
          fi
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add assets/*-logo-web.png
          git commit -m "Correct web logo crop bounds [skip ci]"
          git push
