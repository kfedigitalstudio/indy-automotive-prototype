name: Prepare web logos

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare safe web logo crops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Crop excess whitespace and update header sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          logos = {
              'assets/indy-auto-group-logo.png': 'assets/indy-auto-group-logo-web.png',
              'assets/indy-auto-repairs-logo.png': 'assets/indy-auto-repairs-logo-web.png',
              'assets/alta-rental-logo.png': 'assets/alta-rental-logo-web.png',
          }

          for src_name, out_name in logos.items():
              src = Path(src_name)
              out = Path(out_name)
              img = Image.open(src).convert('RGBA')

              # Detect the actual artwork against either transparent or near-white canvas.
              rgb = img.convert('RGB')
              white = Image.new('RGB', rgb.size, (255, 255, 255))
              diff = ImageChops.difference(rgb, white).convert('L')
              # Ignore tiny JPEG/PNG compression variations in the white background.
              mask = diff.point(lambda p: 255 if p > 18 else 0)

              # If transparency is meaningful, include visible non-transparent pixels too.
              alpha = img.getchannel('A')
              alpha_mask = alpha.point(lambda p: 255 if p > 20 else 0)
              mask = ImageChops.lighter(mask, alpha_mask)

              bbox = mask.getbbox()
              if bbox:
                  l, t, r, b = bbox
                  pad_x = max(18, int((r - l) * 0.05))
                  pad_y = max(14, int((b - t) * 0.07))
                  l = max(0, l - pad_x)
                  t = max(0, t - pad_y)
                  r = min(img.width, r + pad_x)
                  b = min(img.height, b + pad_y)
                  img = img.crop((l, t, r, b))

              # Keep browser assets reasonably sized while preserving quality.
              max_w = 900
              if img.width > max_w:
                  ratio = max_w / img.width
                  img = img.resize((max_w, max(1, round(img.height * ratio))), Image.Resampling.LANCZOS)

              img.save(out, 'PNG', optimize=True)
              print(f'{src_name}: {Image.open(src).size} -> {out_name}: {img.size}')

          pages = [
              Path('dealer/index.html'),
              Path('repairs/index.html'),
              Path('repairs/brakes/index.html'),
              Path('rental/index.html'),
          ]

          old_desktop = '.brand-logo{display:flex;align-items:center;justify-content:flex-start;min-width:300px;width:300px;height:90px;overflow:hidden}.brand-logo img{display:block;width:300px;height:90px;object-fit:contain;object-position:center;transform:scale(1.8);transform-origin:center}'
          new_desktop = '.brand-logo{display:flex;align-items:center;justify-content:flex-start;min-width:220px;height:94px;overflow:visible}.brand-logo img{display:block;width:auto;height:auto;max-width:230px;max-height:86px;object-fit:contain;object-position:left center;transform:none}'
          old_mobile = '.brand-logo{min-width:0;width:220px;height:64px}.brand-logo img{width:220px;height:64px;object-fit:contain;object-position:center;transform:scale(1.75);transform-origin:center}'
          new_mobile = '.brand-logo{min-width:0;width:auto;height:70px}.brand-logo img{width:auto;height:auto;max-width:185px;max-height:64px;object-fit:contain;object-position:left center;transform:none}'

          replacements = {
              'indy-auto-group-logo.png': 'indy-auto-group-logo-web.png',
              'indy-auto-repairs-logo.png': 'indy-auto-repairs-logo-web.png',
              'alta-rental-logo.png': 'alta-rental-logo-web.png',
          }

          for p in pages:
              s = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if old_desktop not in s:
                  raise RuntimeError(f'Current desktop logo CSS not found in {p}')
              s = s.replace(old_desktop, new_desktop, 1)
              if old_mobile not in s:
                  raise RuntimeError(f'Current mobile logo CSS not found in {p}')
              s = s.replace(old_mobile, new_mobile, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit safe web logo assets
        shell: bash
        run: |
          git config user.name "KFE Digital Studio"
          git config user.email "actions@users.noreply.github.com"
          git add assets/*-logo-web.png dealer/index.html repairs/index.html repairs/brakes/index.html rental/index.html
          git commit -m "Use cropped web logos with safe header sizing [skip ci]"
          git push
